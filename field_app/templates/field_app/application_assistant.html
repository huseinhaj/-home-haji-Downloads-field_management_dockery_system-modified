<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Msaidizi wa Maombi — HESLB & TCU</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#0A2B5E;--gold:#C8900A;--light:#EEF1F6;--white:#fff;
  --text:#0F1923;--muted:#5A6B7E;--border:#C8D0DB;
  --success:#059669;--danger:#DC2626;
  --chat-bg:#F0F2F5;--bubble-ai:#fff;--bubble-user:#0A2B5E;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;background:var(--light);}
body{display:flex;flex-direction:column;}

/* TOP BAR */
.top-bar{background:var(--navy);border-bottom:3px solid var(--gold);padding:0 20px;height:54px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:10;}
.ai-avatar{width:38px;height:38px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-avatar i{color:#fff;font-size:16px;}
.ai-info .name{color:#fff;font-weight:800;font-size:14px;}
.ai-info .sub{color:rgba(255,255,255,.5);font-size:11px;}
.status-dot{width:8px;height:8px;background:#22C55E;border-radius:50%;display:inline-block;margin-right:4px;}
.top-actions{margin-left:auto;display:flex;gap:8px;}
.btn-top{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:4px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;}
.btn-top:hover{background:rgba(255,255,255,.2);}

/* LAYOUT */
.app-layout{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden;}
@media(max-width:768px){.app-layout{grid-template-columns:1fr;}.side-panel{display:none;}}

/* CHAT AREA */
.chat-area{display:flex;flex-direction:column;background:var(--chat-bg);overflow:hidden;}
.chat-messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:10px;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:2px;}

/* BUBBLES */
.msg-row{display:flex;gap:8px;max-width:80%;}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-row.ai{align-self:flex-start;}
.bubble-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:2px;}
.ai .bubble-avatar{background:var(--gold);color:#fff;}
.user .bubble-avatar{background:var(--navy);color:rgba(255,255,255,.7);}
.bubble{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.55;max-width:100%;}
.ai .bubble{background:var(--bubble-ai);color:var(--text);border-radius:0 12px 12px 12px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.user .bubble{background:var(--bubble-user);color:#fff;border-radius:12px 0 12px 12px;}
.bubble-time{font-size:10px;color:var(--muted);margin-top:3px;text-align:right;}
.user .bubble-time{text-align:left;}

/* TYPING INDICATOR */
.typing-row{display:flex;gap:8px;align-items:center;}
.typing-dots{display:flex;gap:4px;padding:10px 14px;background:var(--white);border-radius:0 12px 12px 12px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.typing-dots span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);}}

/* INPUT AREA */
.chat-input-area{padding:12px 16px;background:var(--white);border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;}
.chat-input{flex:1;border:1.5px solid var(--border);border-radius:20px;padding:10px 16px;font-size:13.5px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.4;color:var(--text);}
.chat-input:focus{border-color:var(--navy);}
.btn-send{width:40px;height:40px;background:var(--navy);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .13s;}
.btn-send:hover{background:#071E42;}
.btn-send i{color:#fff;font-size:15px;}
.btn-send:disabled{background:var(--border);cursor:not-allowed;}

/* SIDE PANEL */
.side-panel{background:var(--white);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.panel-header{background:var(--navy);border-bottom:3px solid var(--gold);padding:14px 18px;}
.panel-header h3{color:#fff;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
.panel-header p{color:rgba(255,255,255,.5);font-size:11px;margin-top:2px;}
.panel-body{flex:1;overflow-y:auto;padding:16px;}
.panel-body::-webkit-scrollbar{width:4px;}
.panel-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px;}

/* PROGRESS */
.progress-wrap{margin-bottom:16px;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.progress-bar{height:6px;background:var(--light);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease;}

/* SECTION GROUPS */
.data-section{margin-bottom:14px;}
.section-title{font-size:10px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--gold);}
.data-field{margin-bottom:8px;}
.field-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px;}
.field-value{font-size:12.5px;color:var(--text);background:var(--light);border:1px solid var(--border);border-radius:4px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;}
.field-value.empty{color:var(--muted);font-style:italic;}
.field-value input{background:transparent;border:none;outline:none;font-size:12.5px;font-family:inherit;color:var(--text);flex:1;}
.btn-edit{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0;}
.btn-edit:hover{color:var(--navy);}

/* CONFIRM BUTTON */
.panel-footer{padding:14px 18px;border-top:1px solid var(--border);}
.btn-confirm{width:100%;padding:12px;background:var(--success);color:#fff;border:none;border-radius:5px;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:background .13s;}
.btn-confirm:hover{background:#047857;}
.btn-confirm:disabled{background:var(--border);cursor:not-allowed;}
.confirm-note{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.4;}

/* DONE STATE */
.done-banner{background:#D1FAE5;border:1px solid #6EE7B7;border-radius:6px;padding:14px;text-align:center;margin-bottom:12px;}
.done-banner i{font-size:24px;color:var(--success);margin-bottom:6px;display:block;}
.done-banner h4{font-size:13px;font-weight:800;color:#064E3B;}
.done-banner p{font-size:11px;color:#065F46;margin-top:4px;line-height:1.4;}

/* EMPTY STATE */
.empty-panel{text-align:center;padding:32px 16px;color:var(--muted);}
.empty-panel i{font-size:32px;margin-bottom:10px;opacity:.3;}
.empty-panel p{font-size:12px;line-height:1.5;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="ai-avatar"><i class="fas fa-robot"></i></div>
  <div class="ai-info">
    <div class="name"><span class="status-dot"></span>Msaidizi wa Maombi</div>
    <div class="sub">HESLB &amp; TCU Application Assistant</div>
  </div>
  <div class="top-actions">
    <button class="btn-top" onclick="restartChat()"><i class="fas fa-redo"></i> Anza Upya</button>
  </div>
</div>

<div class="app-layout">

  <!-- CHAT -->
  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="msg-row ai">
        <div class="bubble-avatar"><i class="fas fa-robot"></i></div>
        <div>
          <div class="bubble" id="openingBubble">{{ opening_message|linebreaksbr }}</div>
          <div class="bubble-time" id="openingTime"></div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" placeholder="Andika ujumbe wako hapa..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-panel">
    <div class="panel-header">
      <h3><i class="fas fa-clipboard-list" style="margin-right:6px;color:var(--gold);"></i>Taarifa Zilizokusanywa</h3>
      <p>Thibitisha kabla ya kuendelea</p>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="empty-panel">
        <i class="fas fa-comments"></i>
        <p>Taarifa zako zitaonekana hapa wakati mazungumzo yatakapoendelea.</p>
      </div>
    </div>
    <div class="panel-footer" id="panelFooter" style="display:none;">
      <button class="btn-confirm" id="confirmBtn" onclick="confirmData()">
        <i class="fas fa-check-circle"></i>THIBITISHA NA ENDELEA
      </button>
      <div class="confirm-note">Kagua taarifa zote kwa makini kabla ya kuthibitisha.</div>
    </div>
  </div>

</div>

<script>
const SECTIONS = {
  'kibinafsi': {
    label: 'Taarifa za Kibinafsi',
    fields: ['jina_kamili','tarehe_kuzaliwa','jinsia','namba_nida','namba_simu','barua_pepe','mkoa_asili','wilaya_asili']
  },
  'olevel': {
    label: 'Matokeo ya Kidato cha Nne',
    fields: ['necta_olevel_index','mwaka_olevel','daraja_olevel']
  },
  'alevel': {
    label: 'Matokeo ya Kidato cha Sita',
    fields: ['necta_alevel_index','mwaka_alevel','masomo_alama','gpa_alevel']
  },
  'programu': {
    label: 'Chaguo za Programu',
    fields: ['chuo_1','chuo_2','chuo_3']
  },
  'familia': {
    label: 'Taarifa za Familia (HESLB)',
    fields: ['jina_baba','jina_mama','mlezi','mapato_familia','idadi_ndugu']
  },
};

const LABELS = {
  jina_kamili:'Jina Kamili', tarehe_kuzaliwa:'Tarehe ya Kuzaliwa', jinsia:'Jinsia',
  namba_nida:'Namba ya NIDA', namba_simu:'Namba ya Simu', barua_pepe:'Barua Pepe',
  mkoa_asili:'Mkoa wa Asili', wilaya_asili:'Wilaya',
  necta_olevel_index:'Namba ya Mtihani (O-Level)', mwaka_olevel:'Mwaka (O-Level)', daraja_olevel:'Daraja',
  necta_alevel_index:'Namba ya Mtihani (A-Level)', mwaka_alevel:'Mwaka (A-Level)',
  masomo_alama:'Masomo na Alama', gpa_alevel:'GPA',
  chuo_1:'Chuo cha 1 & Programu', chuo_2:'Chuo cha 2 & Programu', chuo_3:'Chuo cha 3 & Programu',
  jina_baba:'Jina la Baba', jina_mama:'Jina la Mama', mlezi:'Mlezi / Guardian',
  mapato_familia:'Mapato ya Familia (Tsh)', idadi_ndugu:'Idadi ya Ndugu',
};

let collectedData = {};
let appStatus = 'collecting';
let totalFields = 23;

// Set opening time
document.getElementById('openingTime').textContent = formatTime(new Date());

function formatTime(d){
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault();sendMessage();}
}

async function sendMessage(){
  const input=document.getElementById('chatInput');
  const msg=input.value.trim();
  if(!msg||appStatus==='done') return;

  appendBubble('user',msg);
  input.value='';
  input.style.height='auto';
  document.getElementById('sendBtn').disabled=true;

  showTyping();
  try{
    const fd=new FormData();
    fd.append('message',msg);
    fd.append('csrfmiddlewaretoken','{{ csrf_token }}');
    const res=await fetch('{% url "app_chat_send" %}',{method:'POST',body:fd});
    const data=await res.json();
    hideTyping();
    appendBubble('ai',data.reply);
    if(data.status==='preview'&&data.data){
      collectedData=data.data;
      appStatus='preview';
      renderPanel();
    }
    if(data.status==='done') appStatus='done';
  }catch(e){
    hideTyping();
    appendBubble('ai','Samahani, hitilafu imetokea. Jaribu tena.');
  }
  document.getElementById('sendBtn').disabled=false;
  document.getElementById('chatInput').focus();
}

function appendBubble(role,text){
  const wrap=document.getElementById('chatMessages');
  const row=document.createElement('div');
  row.className='msg-row '+role;
  const icon=role==='ai'?'fa-robot':'fa-user';
  const content=text.replace(/\n/g,'<br>');
  row.innerHTML=`
    <div class="bubble-avatar"><i class="fas ${icon}"></i></div>
    <div>
      <div class="bubble">${content}</div>
      <div class="bubble-time">${formatTime(new Date())}</div>
    </div>`;
  wrap.appendChild(row);
  wrap.scrollTop=wrap.scrollHeight;
}

let typingEl=null;
function showTyping(){
  const wrap=document.getElementById('chatMessages');
  typingEl=document.createElement('div');
  typingEl.className='msg-row ai typing-row';
  typingEl.innerHTML=`
    <div class="bubble-avatar"><i class="fas fa-robot"></i></div>
    <div class="typing-dots"><span></span><span></span><span></span></div>`;
  wrap.appendChild(typingEl);
  wrap.scrollTop=wrap.scrollHeight;
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

function renderPanel(){
  const filled=Object.keys(collectedData).filter(k=>collectedData[k]&&collectedData[k]!=='').length;
  const pct=Math.round((filled/totalFields)*100);
  let html=`
    <div class="progress-wrap">
      <div class="progress-label"><span>Maendeleo</span><span>${filled}/${totalFields}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;

  for(const [secKey,sec] of Object.entries(SECTIONS)){
    const hasAny=sec.fields.some(f=>collectedData[f]);
    if(!hasAny) continue;
    html+=`<div class="data-section"><div class="section-title">${sec.label}</div>`;
    for(const f of sec.fields){
      const val=collectedData[f]||'';
      const label=LABELS[f]||f;
      const isEmpty=!val;
      html+=`
        <div class="data-field">
          <div class="field-label">${label}</div>
          <div class="field-value ${isEmpty?'empty':''}" id="fv_${f}">
            ${isEmpty?'Bado...':`<input type="text" value="${escHtml(val)}" onblur="saveField('${f}',this.value)" id="fi_${f}">`}
            ${isEmpty?'':`<button class="btn-edit" title="Hariri" onclick="document.getElementById('fi_${f}').focus()"><i class="fas fa-pen"></i></button>`}
          </div>
        </div>`;
    }
    html+='</div>';
  }

  document.getElementById('panelBody').innerHTML=html;
  document.getElementById('panelFooter').style.display=appStatus==='preview'?'block':'none';
}

function escHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function saveField(field,value){
  collectedData[field]=value;
  const fd=new FormData();
  fd.append('field',field);
  fd.append('value',value);
  fd.append('csrfmiddlewaretoken','{{ csrf_token }}');
  await fetch('{% url "app_edit_field" %}',{method:'POST',body:fd});
}

async function confirmData(){
  const btn=document.getElementById('confirmBtn');
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Inathibitisha...';
  try{
    const fd=new FormData();
    fd.append('csrfmiddlewaretoken','{{ csrf_token }}');
    const res=await fetch('{% url "app_confirm" %}',{method:'POST',body:fd});
    const data=await res.json();
    if(data.status==='done'){
      appStatus='done';
      document.getElementById('panelBody').innerHTML=`
        <div class="done-banner">
          <i class="fas fa-check-circle"></i>
          <h4>Taarifa Zimethibitishwa!</h4>
          <p>${data.message}</p>
        </div>`;
      document.getElementById('panelFooter').style.display='none';
      appendBubble('ai','✅ Asante! Taarifa zako zimethibitishwa kikamilifu. Hatua inayofuata ni AI kuingia mfumo wa HESLB na TCU kwa niaba yako. Utaarifiwa mara itakapokamilika.');
    }
  }catch(e){
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-check-circle"></i>THIBITISHA NA ENDELEA';
  }
}

function restartChat(){
  if(confirm('Una uhakika? Taarifa zote zilizokusanywa zitafutwa.')){
    window.location.reload();
  }
}
</script>
</body>
</html>
