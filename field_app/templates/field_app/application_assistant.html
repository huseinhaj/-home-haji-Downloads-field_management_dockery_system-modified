<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Msaidizi wa Maombi — HESLB & TCU</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* ── TANZANIA FLAG BACKGROUND ─────────────────────────────── */
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;overflow:hidden;}

.tz-flag-bg{
  position:fixed;inset:0;z-index:0;
  background:
    linear-gradient(
      to bottom right,
      #1EB53A 0%,
      #1EB53A calc(50% - 70px),
      #FCD116 calc(50% - 70px),
      #FCD116 calc(50% - 50px),
      #000000 calc(50% - 50px),
      #000000 calc(50% + 50px),
      #FCD116 calc(50% + 50px),
      #FCD116 calc(50% + 70px),
      #00A3DD calc(50% + 70px),
      #00A3DD 100%
    );
}
.tz-flag-bg::after{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,.2);
  backdrop-filter:blur(1px);
}

/* ── LAYOUT ──────────────────────────────────────────────── */
.app-shell{
  position:relative;z-index:1;
  height:100vh;display:flex;flex-direction:column;
  padding:14px;gap:10px;
}

/* ── TOP BAR ─────────────────────────────────────────────── */
.top-bar{
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  padding:10px 20px;
  display:flex;align-items:center;gap:14px;
  flex-shrink:0;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.flag-strip{
  display:flex;flex-direction:column;gap:0;
  border-radius:5px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.5);
  flex-shrink:0;width:28px;
}
.flag-strip .f-g{height:10px;background:#1EB53A;}
.flag-strip .f-y{height:3px;background:#FCD116;}
.flag-strip .f-k{height:10px;background:#000;}
.flag-strip .f-y2{height:3px;background:#FCD116;}
.flag-strip .f-b{height:10px;background:#00A3DD;}

.ai-avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#FCD116,#f0a500);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(252,209,22,.45);flex-shrink:0;
}
.ai-avatar i{color:#000;font-size:17px;}
.ai-info .name{
  color:#fff;font-weight:800;font-size:15px;letter-spacing:.2px;
  display:flex;align-items:center;gap:8px;
}
.status-pip{
  width:8px;height:8px;border-radius:50%;
  background:#22C55E;box-shadow:0 0 6px #22C55E;
  animation:pulse-green 2s infinite;
}
@keyframes pulse-green{0%,100%{box-shadow:0 0 6px #22C55E;}50%{box-shadow:0 0 16px #22C55E;}}
.ai-info .sub{color:rgba(255,255,255,.4);font-size:11px;margin-top:2px;letter-spacing:.3px;}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.tz-badge{
  color:rgba(255,255,255,.5);font-size:10px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  border-right:1px solid rgba(255,255,255,.12);
  padding-right:10px;display:flex;align-items:center;gap:5px;
}
.btn-restart{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.6);
  border-radius:8px;padding:7px 14px;
  font-size:11px;font-weight:700;cursor:pointer;
  font-family:inherit;letter-spacing:.4px;
  display:flex;align-items:center;gap:6px;
  transition:all .15s;
}
.btn-restart:hover{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3);}

/* ── MAIN ────────────────────────────────────────────────── */
.main-panel{
  flex:1;display:grid;
  grid-template-columns:1fr 310px;
  gap:10px;overflow:hidden;min-height:0;
}
@media(max-width:800px){
  .main-panel{grid-template-columns:1fr;}
  .data-panel{display:none;}
}

/* glass card base */
.glass-card{
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  overflow:hidden;
}

/* ── CHAT ────────────────────────────────────────────────── */
.chat-card{display:flex;flex-direction:column;}
.chat-messages{
  flex:1;overflow-y:auto;
  padding:20px 16px;
  display:flex;flex-direction:column;gap:14px;
  scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px;}

/* bubbles */
.msg-row{display:flex;gap:10px;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg-row.ai{align-self:flex-start;max-width:84%;}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;max-width:78%;}

.bub-av{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;margin-top:2px;
}
.ai .bub-av{
  background:linear-gradient(135deg,#FCD116,#e0900a);
  box-shadow:0 3px 10px rgba(252,209,22,.4);color:#000;
}
.user .bub-av{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.7);
}
.bubble{padding:11px 16px;font-size:13.5px;line-height:1.6;word-break:break-word;}
.ai .bubble{
  background:rgba(255,255,255,.93);color:#0F1923;
  border-radius:4px 18px 18px 18px;
  box-shadow:0 4px 18px rgba(0,0,0,.18);
}
.user .bubble{
  background:linear-gradient(135deg,rgba(0,55,140,.88),rgba(0,35,90,.92));
  color:#fff;border-radius:18px 4px 18px 18px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 4px 18px rgba(0,0,0,.25);
}
.bub-time{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px;padding:0 3px;}

/* typing */
.typing-dots{
  display:flex;gap:5px;padding:13px 18px;
  background:rgba(255,255,255,.93);
  border-radius:4px 18px 18px 18px;
  box-shadow:0 4px 18px rgba(0,0,0,.18);
  width:fit-content;
}
.typing-dots span{
  width:7px;height:7px;background:#888;border-radius:50%;
  animation:blink 1.3s infinite;
}
.typing-dots span:nth-child(2){animation-delay:.22s;}
.typing-dots span:nth-child(3){animation-delay:.44s;}
@keyframes blink{0%,60%,100%{opacity:.25;transform:scale(.9);}30%{opacity:1;transform:scale(1.2);}}

/* input */
.chat-input-row{
  padding:12px 14px;
  border-top:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.18);
  display:flex;gap:10px;align-items:flex-end;
}
.chat-input{
  flex:1;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;padding:10px 16px;
  font-size:13.5px;font-family:inherit;
  color:#fff;outline:none;resize:none;
  max-height:110px;line-height:1.5;
  transition:all .15s;
}
.chat-input::placeholder{color:rgba(255,255,255,.3);}
.chat-input:focus{border-color:rgba(252,209,22,.55);background:rgba(255,255,255,.16);}
.btn-send{
  width:42px;height:42px;
  background:linear-gradient(135deg,#FCD116,#d48d00);
  border:none;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(252,209,22,.45);
  transition:all .15s;flex-shrink:0;
}
.btn-send:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(252,209,22,.55);}
.btn-send:disabled{background:rgba(255,255,255,.12);box-shadow:none;cursor:not-allowed;transform:none;}
.btn-send i{color:#000;font-size:15px;}

/* ── DATA PANEL ──────────────────────────────────────────── */
.data-panel{display:flex;flex-direction:column;}
.panel-head{
  padding:15px 18px;
  border-bottom:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.22);flex-shrink:0;
}
.panel-head h3{
  color:#fff;font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;
  display:flex;align-items:center;gap:7px;
}
.panel-head h3 i{color:#FCD116;font-size:12px;}
.panel-head p{color:rgba(255,255,255,.35);font-size:10px;margin-top:3px;letter-spacing:.3px;}
.panel-body{flex:1;overflow-y:auto;padding:14px;}
.panel-body::-webkit-scrollbar{width:3px;}
.panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}

/* progress */
.prog-wrap{margin-bottom:14px;}
.prog-label{
  display:flex;justify-content:space-between;
  font-size:10px;font-weight:700;
  color:rgba(255,255,255,.45);letter-spacing:.4px;
  text-transform:uppercase;margin-bottom:6px;
}
.prog-track{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.prog-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#1EB53A 0%,#FCD116 60%,#00A3DD 100%);
  transition:width .5s ease;
  box-shadow:0 0 8px rgba(252,209,22,.35);
}

/* sections */
.sec-lbl{
  font-size:9px;font-weight:800;color:#FCD116;
  text-transform:uppercase;letter-spacing:1px;
  margin:12px 0 7px;padding-bottom:5px;
  border-bottom:1px solid rgba(252,209,22,.2);
  display:flex;align-items:center;gap:5px;
}
.sec-lbl i{font-size:9px;}
.drow{margin-bottom:7px;}
.dlbl{
  font-size:9px;font-weight:700;color:rgba(255,255,255,.4);
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;
}
.dval{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  border-radius:8px;padding:7px 11px;
  font-size:12px;color:#fff;
  display:flex;align-items:center;gap:6px;min-height:32px;
}
.dval.empty{color:rgba(255,255,255,.2);font-style:italic;font-size:11px;}
.dval input{
  background:transparent;border:none;outline:none;
  font-size:12px;font-family:inherit;color:#fff;flex:1;min-width:0;
}
.btn-ef{
  background:none;border:none;color:rgba(255,255,255,.25);
  cursor:pointer;font-size:11px;padding:0;flex-shrink:0;
  transition:color .1s;
}
.btn-ef:hover{color:#FCD116;}

/* confirm */
.panel-foot{
  padding:13px 15px;
  border-top:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.18);flex-shrink:0;
}
.btn-confirm{
  width:100%;padding:12px;
  background:linear-gradient(135deg,#059669,#047857);
  color:#fff;border:none;border-radius:10px;
  font-size:12px;font-weight:800;cursor:pointer;
  letter-spacing:.6px;text-transform:uppercase;
  font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(5,150,105,.4);
  transition:all .15s;
}
.btn-confirm:hover{background:linear-gradient(135deg,#047857,#065f46);transform:translateY(-1px);}
.btn-confirm:disabled{background:rgba(255,255,255,.08);box-shadow:none;cursor:not-allowed;transform:none;}
.confirm-note{font-size:10px;color:rgba(255,255,255,.25);text-align:center;margin-top:7px;line-height:1.4;}

/* done */
.done-card{
  background:rgba(5,150,105,.18);border:1px solid rgba(5,150,105,.35);
  border-radius:12px;padding:18px;text-align:center;margin-bottom:10px;
}
.done-card i{font-size:28px;color:#34D399;margin-bottom:8px;display:block;}
.done-card h4{color:#fff;font-size:13px;font-weight:800;}
.done-card p{color:rgba(255,255,255,.5);font-size:11px;margin-top:5px;line-height:1.5;}

/* empty */
.empty-state{text-align:center;padding:40px 14px;color:rgba(255,255,255,.2);}
.empty-state i{font-size:34px;margin-bottom:12px;display:block;}
.empty-state p{font-size:11px;line-height:1.7;}

/* tz watermark */
.watermark{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:0;font-size:180px;opacity:.035;
  pointer-events:none;user-select:none;
}
</style>
</head>
<body>

<div class="tz-flag-bg"></div>
<div class="watermark">🇹🇿</div>

<div class="app-shell">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="flag-strip">
      <div class="f-g"></div>
      <div class="f-y"></div>
      <div class="f-k"></div>
      <div class="f-y2"></div>
      <div class="f-b"></div>
    </div>
    <div class="ai-avatar"><i class="fas fa-robot"></i></div>
    <div class="ai-info">
      <div class="name">
        <span class="status-pip"></span>Msaidizi wa Maombi
      </div>
      <div class="sub">HESLB &amp; TCU Application Assistant · Tanzania</div>
    </div>
    <div class="top-right">
      <span class="tz-badge"><i class="fas fa-flag"></i>Tanzania</span>
      <button class="btn-restart" onclick="restartChat()">
        <i class="fas fa-rotate-left"></i> Anza Upya
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-panel">

    <!-- CHAT CARD -->
    <div class="glass-card chat-card">
      <div class="chat-messages" id="chatMessages">
        <div class="msg-row ai">
          <div class="bub-av"><i class="fas fa-robot"></i></div>
          <div>
            <div class="bubble">{{ opening_message|linebreaksbr }}</div>
            <div class="bub-time" id="openingTime"></div>
          </div>
        </div>
      </div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput"
          placeholder="Andika jibu lako hapa..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <!-- DATA PANEL -->
    <div class="glass-card data-panel">
      <div class="panel-head">
        <h3><i class="fas fa-clipboard-check"></i>Taarifa Zilizokusanywa</h3>
        <p>Inaandaliwa kwa ajili ya HESLB na TCU</p>
      </div>
      <div class="panel-body" id="panelBody">
        <div class="empty-state">
          <i class="fas fa-comments"></i>
          <p>Jibu maswali ya Msaidizi.<br>Taarifa zako zitaonekana hapa moja kwa moja.</p>
        </div>
      </div>
      <div class="panel-foot" id="panelFoot" style="display:none;">
        <button class="btn-confirm" id="confirmBtn" onclick="confirmData()">
          <i class="fas fa-circle-check"></i>THIBITISHA NA ENDELEA
        </button>
        <div class="confirm-note">Kagua taarifa zote kabla ya kuthibitisha</div>
      </div>
    </div>

  </div>
</div>

<script>
const SECTIONS = [
  {label:'Taarifa za Kibinafsi', icon:'fa-user', fields:[
    {k:'jina_kamili',l:'Jina Kamili'},
    {k:'tarehe_kuzaliwa',l:'Tarehe ya Kuzaliwa'},
    {k:'jinsia',l:'Jinsia'},
    {k:'namba_nida',l:'Namba ya NIDA'},
    {k:'namba_simu',l:'Namba ya Simu'},
    {k:'barua_pepe',l:'Barua Pepe'},
    {k:'mkoa_asili',l:'Mkoa wa Asili'},
    {k:'wilaya_asili',l:'Wilaya'},
  ]},
  {label:'Kidato cha Nne (O-Level)', icon:'fa-graduation-cap', fields:[
    {k:'necta_olevel_index',l:'Namba ya Mtihani'},
    {k:'mwaka_olevel',l:'Mwaka'},
    {k:'daraja_olevel',l:'Daraja'},
  ]},
  {label:'Kidato cha Sita (A-Level)', icon:'fa-award', fields:[
    {k:'necta_alevel_index',l:'Namba ya Mtihani'},
    {k:'mwaka_alevel',l:'Mwaka'},
    {k:'masomo_alama',l:'Masomo na Alama'},
    {k:'gpa_alevel',l:'GPA'},
  ]},
  {label:'Chaguo za Programu (TCU)', icon:'fa-university', fields:[
    {k:'chuo_1',l:'Chuo cha 1 & Programu'},
    {k:'chuo_2',l:'Chuo cha 2 & Programu'},
    {k:'chuo_3',l:'Chuo cha 3 & Programu'},
  ]},
  {label:'Taarifa za Familia (HESLB)', icon:'fa-people-roof', fields:[
    {k:'jina_baba',l:'Jina la Baba'},
    {k:'jina_mama',l:'Jina la Mama'},
    {k:'mlezi',l:'Mlezi / Guardian'},
    {k:'mapato_familia',l:'Mapato (Tsh/mwezi)'},
    {k:'idadi_ndugu',l:'Idadi ya Ndugu'},
  ]},
];
const TOTAL=23;
let collectedData={}, appStatus='collecting';

document.getElementById('openingTime').textContent=nowTime();

function nowTime(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

async function sendMessage(){
  const inp=document.getElementById('chatInput');
  const msg=inp.value.trim();
  if(!msg||appStatus==='done') return;
  addBubble('user',msg);
  inp.value='';inp.style.height='auto';
  document.getElementById('sendBtn').disabled=true;
  showTyping();
  try{
    const fd=new FormData();
    fd.append('message',msg);
    fd.append('csrfmiddlewaretoken','{{ csrf_token }}');
    const res=await fetch('{% url "app_chat_send" %}',{method:'POST',body:fd});
    const data=await res.json();
    hideTyping();
    addBubble('ai',data.reply||data.error||'Hitilafu. Jaribu tena.');
    if(data.status==='preview'&&data.data){collectedData=data.data;appStatus='preview';renderPanel();}
    if(data.status==='done') appStatus='done';
  }catch(e){
    hideTyping();
    addBubble('ai','Hitilafu ya mtandao. Tafadhali jaribu tena.');
  }
  document.getElementById('sendBtn').disabled=false;
  document.getElementById('chatInput').focus();
}

function addBubble(role,text){
  const wrap=document.getElementById('chatMessages');
  const row=document.createElement('div');
  row.className='msg-row '+role;
  const icon=role==='ai'?'fa-robot':'fa-user';
  row.innerHTML=`
    <div class="bub-av"><i class="fas ${icon}"></i></div>
    <div>
      <div class="bubble">${text.replace(/\n/g,'<br>')}</div>
      <div class="bub-time">${nowTime()}</div>
    </div>`;
  wrap.appendChild(row);
  wrap.scrollTop=wrap.scrollHeight;
}

let typingEl=null;
function showTyping(){
  const wrap=document.getElementById('chatMessages');
  typingEl=document.createElement('div');
  typingEl.className='msg-row ai';
  typingEl.innerHTML=`<div class="bub-av"><i class="fas fa-robot"></i></div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  wrap.appendChild(typingEl);
  wrap.scrollTop=wrap.scrollHeight;
}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

function renderPanel(){
  const filled=Object.values(collectedData).filter(v=>v&&v!=='').length;
  const pct=Math.min(100,Math.round((filled/TOTAL)*100));
  let html=`<div class="prog-wrap">
    <div class="prog-label"><span>Maendeleo</span><span>${filled}/${TOTAL} sehemu</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
  </div>`;
  for(const sec of SECTIONS){
    if(!sec.fields.some(f=>collectedData[f.k])) continue;
    html+=`<div class="sec-lbl"><i class="fas ${sec.icon}"></i>${sec.label}</div>`;
    for(const f of sec.fields){
      const val=collectedData[f.k]||'';
      html+=`<div class="drow">
        <div class="dlbl">${f.l}</div>
        <div class="dval ${val?'':'empty'}">${
          val?`<input type="text" value="${esc(val)}" id="di_${f.k}" onblur="saveField('${f.k}',this.value)">
               <button class="btn-ef" onclick="document.getElementById('di_${f.k}').focus()"><i class="fas fa-pen-to-square"></i></button>`
             :'Bado...'
        }</div>
      </div>`;
    }
  }
  document.getElementById('panelBody').innerHTML=html;
  document.getElementById('panelFoot').style.display=appStatus==='preview'?'block':'none';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function saveField(field,value){
  collectedData[field]=value;
  const fd=new FormData();
  fd.append('field',field);fd.append('value',value);
  fd.append('csrfmiddlewaretoken','{{ csrf_token }}');
  await fetch('{% url "app_edit_field" %}',{method:'POST',body:fd});
}

async function confirmData(){
  const btn=document.getElementById('confirmBtn');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>&nbsp;Inathibitisha...';
  try{
    const fd=new FormData();fd.append('csrfmiddlewaretoken','{{ csrf_token }}');
    const res=await fetch('{% url "app_confirm" %}',{method:'POST',body:fd});
    const data=await res.json();
    if(data.status==='done'){
      appStatus='done';
      document.getElementById('panelBody').innerHTML=`
        <div class="done-card">
          <i class="fas fa-circle-check"></i>
          <h4>Taarifa Zimethibitishwa!</h4>
          <p>${data.message}</p>
        </div>`;
      document.getElementById('panelFoot').style.display='none';
      addBubble('ai','✅ Asante sana! Taarifa zako zimethibitishwa kikamilifu. Hatua inayofuata ni AI kuingia mfumo wa HESLB na TCU kwa niaba yako. Utaarifiwa mara itakapokamilika.');
    }
  }catch(e){
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-circle-check"></i>THIBITISHA NA ENDELEA';
  }
}

function restartChat(){
  if(confirm('Una uhakika? Taarifa zote zilizokusanywa zitafutwa na mazungumzo yataanzishwa upya.'))
    window.location.reload();
}
</script>
