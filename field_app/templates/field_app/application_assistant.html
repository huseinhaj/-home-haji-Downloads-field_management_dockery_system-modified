<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Msaidizi wa Maombi — HESLB & TCU</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:'Inter',system-ui,sans-serif;
  font-size:14px;overflow:hidden;
  /* kill iOS tap delay everywhere */
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

/* ── TANZANIA FLAG ───────────────────────────────────────── */
.tz-bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(
    to bottom right,
    #1EB53A 0%,
    #1EB53A calc(50% - 68px),
    #FCD116 calc(50% - 68px),
    #FCD116 calc(50% - 50px),
    #000    calc(50% - 50px),
    #000    calc(50% + 50px),
    #FCD116 calc(50% + 50px),
    #FCD116 calc(50% + 68px),
    #00A3DD calc(50% + 68px),
    #00A3DD 100%
  );
}
.tz-bg::after{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,.22);
}
.watermark{
  position:fixed;bottom:10px;left:50%;
  transform:translateX(-50%);z-index:0;
  font-size:200px;opacity:.03;
  pointer-events:none;user-select:none;
  line-height:1;
}

/* ── SHELL ───────────────────────────────────────────────── */
.shell{
  position:relative;z-index:1;
  height:100vh;display:flex;flex-direction:column;
  padding:12px;gap:10px;
}

/* ── TOP BAR ─────────────────────────────────────────────── */
.topbar{
  flex-shrink:0;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.16);
  border-radius:16px;
  padding:9px 18px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.flag-v{
  display:flex;flex-direction:column;
  border-radius:5px;overflow:hidden;
  box-shadow:0 1px 6px rgba(0,0,0,.5);
  flex-shrink:0;width:26px;
}
.flag-v div{height:10px;}
.fv-g{background:#1EB53A;}
.fv-y{height:3px!important;background:#FCD116;}
.fv-k{background:#000;}
.fv-y2{height:3px!important;background:#FCD116;}
.fv-b{background:#00A3DD;}

.aibadge{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#FCD116,#d48d00);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(252,209,22,.5);flex-shrink:0;
}
.aibadge i{color:#000;font-size:16px;}
.aiinfo .n{
  color:#fff;font-weight:800;font-size:14px;
  display:flex;align-items:center;gap:7px;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:#22C55E;
  box-shadow:0 0 0 0 rgba(34,197,94,.6);
  animation:sonar 2s infinite;
}
@keyframes sonar{
  0%{box-shadow:0 0 0 0 rgba(34,197,94,.6);}
  70%{box-shadow:0 0 0 8px rgba(34,197,94,0);}
  100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
}
.aiinfo .s{color:rgba(255,255,255,.38);font-size:10.5px;margin-top:2px;letter-spacing:.2px;}
.tbright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tz-tag{
  color:rgba(255,255,255,.4);font-size:10px;font-weight:700;
  letter-spacing:.9px;text-transform:uppercase;
  border-right:1px solid rgba(255,255,255,.1);
  padding-right:10px;display:flex;align-items:center;gap:4px;
}
.tbtn{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
  color:rgba(255,255,255,.55);
  border-radius:8px;padding:7px 13px;
  font-size:11px;font-weight:700;cursor:pointer;
  font-family:inherit;letter-spacing:.4px;
  display:flex;align-items:center;gap:5px;
  transition:background .12s,color .12s;
  /* no tap highlight */
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
}
.tbtn:hover,.tbtn:active{background:rgba(255,255,255,.16);color:#fff;}
.tbtn.demo{border-color:rgba(252,209,22,.3);color:rgba(252,209,22,.75);}
.tbtn.demo:hover,.tbtn.demo:active{background:rgba(252,209,22,.15);color:#FCD116;}

/* ── GRID ────────────────────────────────────────────────── */
.grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:1fr 308px;
  gap:10px;
}
@media(max-width:780px){
  .grid{grid-template-columns:1fr;}
  .dpanel{display:none;}
}

/* glass base */
.glass{
  background:rgba(255,255,255,.09);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.32);
  overflow:hidden;
}

/* ── CHAT ────────────────────────────────────────────────── */
.chat{display:flex;flex-direction:column;}
.msgs{
  flex:1;overflow-y:auto;
  padding:18px 14px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
  overscroll-behavior:contain;
}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}

/* bubbles */
.row{
  display:flex;gap:9px;
  animation:pop .2s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes pop{
  from{opacity:0;transform:translateY(6px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.row.ai{align-self:flex-start;max-width:86%;}
.row.me{align-self:flex-end;flex-direction:row-reverse;max-width:80%;}

.av{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;margin-top:3px;
}
.ai .av{
  background:linear-gradient(135deg,#FCD116,#d48d00);
  box-shadow:0 2px 10px rgba(252,209,22,.4);color:#000;
}
.me .av{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.65);
}

.bub{
  padding:10px 15px;font-size:13.5px;line-height:1.62;
  word-break:break-word;position:relative;
}
.ai .bub{
  background:rgba(255,255,255,.94);color:#0f1923;
  border-radius:3px 16px 16px 16px;
  box-shadow:0 3px 14px rgba(0,0,0,.16);
}
.me .bub{
  background:linear-gradient(135deg,rgba(0,55,140,.9),rgba(0,38,100,.94));
  color:#fff;border-radius:16px 3px 16px 16px;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 3px 14px rgba(0,0,0,.22);
}
.ts{font-size:10px;color:rgba(255,255,255,.28);margin-top:3px;padding:0 2px;}

/* streaming cursor */
.cursor{
  display:inline-block;
  color:#FCD116;font-weight:300;
  animation:cur .6s step-end infinite;
}
@keyframes cur{0%,100%{opacity:1;}50%{opacity:0;}}

/* typing dots */
.tdots{
  display:flex;gap:5px;padding:12px 16px;
  background:rgba(255,255,255,.94);
  border-radius:3px 16px 16px 16px;
  box-shadow:0 3px 14px rgba(0,0,0,.16);
  width:fit-content;
}
.tdots span{
  width:6px;height:6px;border-radius:50%;
  background:rgba(0,0,0,.25);
  animation:tdot 1.2s ease-in-out infinite;
}
.tdots span:nth-child(2){animation-delay:.18s;}
.tdots span:nth-child(3){animation-delay:.36s;}
@keyframes tdot{0%,80%,100%{transform:scale(.7);opacity:.4;}40%{transform:scale(1.1);opacity:1;}}

/* input bar */
.ibar{
  padding:10px 12px;
  border-top:1px solid rgba(255,255,255,.09);
  background:rgba(0,0,0,.2);
  display:flex;gap:9px;align-items:flex-end;
}
.inp{
  flex:1;
  background:rgba(255,255,255,.09);
  border:1.5px solid rgba(255,255,255,.16);
  border-radius:13px;padding:9px 14px;
  font-size:13.5px;font-family:inherit;
  color:#fff;outline:none;resize:none;
  max-height:100px;line-height:1.5;
  transition:border-color .12s,background .12s;
  /* instant on mobile */
  touch-action:manipulation;
}
.inp::placeholder{color:rgba(255,255,255,.28);}
.inp:focus{
  border-color:rgba(252,209,22,.5);
  background:rgba(255,255,255,.14);
}
.sbtn{
  width:40px;height:40px;
  background:linear-gradient(135deg,#FCD116,#d48d00);
  border:none;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 12px rgba(252,209,22,.45);
  transition:transform .12s,box-shadow .12s;
  flex-shrink:0;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.sbtn:active{transform:scale(.92);box-shadow:0 1px 6px rgba(252,209,22,.3);}
.sbtn:disabled{background:rgba(255,255,255,.1);box-shadow:none;}
.sbtn i{color:#000;font-size:14px;}

/* ── DATA PANEL ──────────────────────────────────────────── */
.dpanel{display:flex;flex-direction:column;}
.dhead{
  padding:13px 16px;
  border-bottom:1px solid rgba(255,255,255,.09);
  background:rgba(0,0,0,.24);flex-shrink:0;
}
.dhead h3{
  color:#fff;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;
  display:flex;align-items:center;gap:6px;
}
.dhead h3 i{color:#FCD116;font-size:11px;}
.dhead p{color:rgba(255,255,255,.32);font-size:10px;margin-top:2px;}
.dbody{flex:1;overflow-y:auto;padding:12px;}
.dbody::-webkit-scrollbar{width:3px;}
.dbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

/* progress */
.prg{margin-bottom:12px;}
.prg-lbl{
  display:flex;justify-content:space-between;
  font-size:9.5px;font-weight:700;
  color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.4px;
  margin-bottom:5px;
}
.prg-t{height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.prg-f{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,#1EB53A,#FCD116 60%,#00A3DD);
  transition:width .45s ease;
  box-shadow:0 0 6px rgba(252,209,22,.3);
}

/* section labels */
.slbl{
  font-size:8.5px;font-weight:800;color:#FCD116;
  text-transform:uppercase;letter-spacing:1px;
  margin:10px 0 6px;padding-bottom:4px;
  border-bottom:1px solid rgba(252,209,22,.18);
  display:flex;align-items:center;gap:4px;
}
.frow{margin-bottom:5px;}
.flbl{
  font-size:8.5px;font-weight:700;
  color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.3px;
  margin-bottom:2px;
}
.fval{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.11);
  border-radius:7px;padding:6px 10px;
  font-size:11.5px;color:#fff;
  display:flex;align-items:center;gap:5px;min-height:28px;
  transition:background .1s;
}
.fval:has(input:focus){
  background:rgba(255,255,255,.13);
  border-color:rgba(252,209,22,.4);
}
.fval.mt{color:rgba(255,255,255,.22);font-style:italic;font-size:11px;}
.fval input{
  background:transparent;border:none;outline:none;
  font-size:11.5px;font-family:inherit;color:#fff;flex:1;min-width:0;
}
.fval input::placeholder{color:rgba(255,255,255,.25);}
.fedit{
  background:none;border:none;color:rgba(255,255,255,.22);
  cursor:pointer;font-size:10px;padding:0;flex-shrink:0;
  transition:color .1s;
  touch-action:manipulation;
}
.fedit:hover,.fedit:active{color:#FCD116;}

/* confirm footer */
.dfoot{
  padding:11px 14px;
  border-top:1px solid rgba(255,255,255,.09);
  background:rgba(0,0,0,.2);flex-shrink:0;
}
.cfm{
  width:100%;padding:11px;
  background:linear-gradient(135deg,#059669,#047857);
  color:#fff;border:none;border-radius:9px;
  font-size:11.5px;font-weight:800;cursor:pointer;
  letter-spacing:.5px;text-transform:uppercase;
  font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 3px 14px rgba(5,150,105,.4);
  transition:transform .12s,box-shadow .12s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.cfm:active{transform:scale(.97);box-shadow:0 1px 6px rgba(5,150,105,.25);}
.cfm:disabled{background:rgba(255,255,255,.07);box-shadow:none;}
.cnote{font-size:10px;color:rgba(255,255,255,.22);text-align:center;margin-top:6px;line-height:1.4;}

/* done card */
.dcard{
  background:rgba(5,150,105,.17);border:1px solid rgba(5,150,105,.32);
  border-radius:11px;padding:16px;text-align:center;
}
.dcard i{font-size:26px;color:#34D399;margin-bottom:7px;display:block;}
.dcard h4{color:#fff;font-size:12.5px;font-weight:800;}
.dcard p{color:rgba(255,255,255,.45);font-size:10.5px;margin-top:4px;line-height:1.5;}

/* empty */
.empty{text-align:center;padding:36px 14px;color:rgba(255,255,255,.2);}
.empty i{font-size:32px;margin-bottom:10px;display:block;}
.empty p{font-size:11px;line-height:1.7;}
</style>
</head>
<body>

<div class="tz-bg"></div>
<div class="watermark">🇹🇿</div>

<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="flag-v">
      <div class="fv-g"></div><div class="fv-y"></div>
      <div class="fv-k"></div><div class="fv-y2"></div>
      <div class="fv-b"></div>
    </div>
    <div class="aibadge"><i class="fas fa-robot"></i></div>
    <div class="aiinfo">
      <div class="n"><span class="dot"></span>Msaidizi wa Maombi</div>
      <div class="s">HESLB &amp; TCU Application Assistant · Tanzania</div>
    </div>
    <div class="tbright">
      <span class="tz-tag"><i class="fas fa-flag"></i>Tanzania</span>
      <button class="tbtn demo" onclick="loadDemo()"><i class="fas fa-flask"></i>Demo</button>
      <button class="tbtn" onclick="doRestart()"><i class="fas fa-rotate-left"></i>Upya</button>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="grid">

    <!-- CHAT -->
    <div class="glass chat">
      <div class="msgs" id="msgs">
        <div class="row ai">
          <div class="av"><i class="fas fa-robot"></i></div>
          <div>
            <div class="bub">{{ opening_message|linebreaksbr }}</div>
            <div class="ts" id="ts0"></div>
          </div>
        </div>
      </div>
      <div class="ibar">
        <textarea class="inp" id="inp"
          placeholder="Andika jibu lako hapa..."
          rows="1"
          onkeydown="onKey(event)"
          oninput="grow(this)"></textarea>
        <button class="sbtn" id="sbtn" onclick="send()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <!-- DATA PANEL -->
    <div class="glass dpanel">
      <div class="dhead">
        <h3><i class="fas fa-clipboard-check"></i>Taarifa Zilizokusanywa</h3>
        <p>Inaandaliwa kwa HESLB na TCU</p>
      </div>
      <div class="dbody" id="dbody">
        <div class="empty">
          <i class="fas fa-comments"></i>
          <p>Jibu maswali ya Msaidizi.<br>Taarifa zako zitaonekana hapa moja kwa moja.</p>
        </div>
      </div>
      <div class="dfoot" id="dfoot" style="display:none;">
        <button class="cfm" id="cfmbtn" onclick="doConfirm()">
          <i class="fas fa-circle-check"></i>THIBITISHA NA ENDELEA
        </button>
        <div class="cnote">Kagua taarifa zote kabla ya kuthibitisha</div>
      </div>
    </div>

  </div>
</div>

<script>
/* ── CONFIG ─────────────────────────────────────────────── */
const STREAM_URL  = '{% url "app_chat_stream" %}';
const EDIT_URL    = '{% url "app_edit_field" %}';
const CONFIRM_URL = '{% url "app_confirm" %}';
const CSRF        = '{{ csrf_token }}';

const SECS = [
  {l:'Taarifa za Kibinafsi',       ic:'fa-user',        fs:[
    {k:'jina_kamili',l:'Jina Kamili'},
    {k:'tarehe_kuzaliwa',l:'Tarehe ya Kuzaliwa'},
    {k:'jinsia',l:'Jinsia'},
    {k:'namba_nida',l:'Namba ya NIDA'},
    {k:'namba_simu',l:'Namba ya Simu'},
    {k:'barua_pepe',l:'Barua Pepe'},
    {k:'mkoa_asili',l:'Mkoa wa Asili'},
    {k:'wilaya_asili',l:'Wilaya'},
  ]},
  {l:'Kidato cha Nne (O-Level)',   ic:'fa-graduation-cap', fs:[
    {k:'necta_olevel_index',l:'Namba ya Mtihani'},
    {k:'mwaka_olevel',l:'Mwaka'},
    {k:'daraja_olevel',l:'Daraja'},
  ]},
  {l:'Kidato cha Sita (A-Level)',  ic:'fa-award',       fs:[
    {k:'necta_alevel_index',l:'Namba ya Mtihani'},
    {k:'mwaka_alevel',l:'Mwaka'},
    {k:'masomo_alama',l:'Masomo na Alama'},
    {k:'gpa_alevel',l:'GPA'},
  ]},
  {l:'Chaguo za Programu (TCU)',   ic:'fa-university',  fs:[
    {k:'chuo_1',l:'Chuo cha 1 & Programu'},
    {k:'chuo_2',l:'Chuo cha 2 & Programu'},
    {k:'chuo_3',l:'Chuo cha 3 & Programu'},
  ]},
  {l:'Taarifa za Familia (HESLB)', ic:'fa-people-roof', fs:[
    {k:'jina_baba',l:'Jina la Baba'},
    {k:'jina_mama',l:'Jina la Mama'},
    {k:'mlezi',l:'Mlezi / Guardian'},
    {k:'mapato_familia',l:'Mapato (Tsh/mwezi)'},
    {k:'idadi_ndugu',l:'Idadi ya Ndugu'},
  ]},
];
const TOTAL = 23;

let data   = {};
let status = 'collecting';
let busy   = false;

/* ── TIME ───────────────────────────────────────────────── */
document.getElementById('ts0').textContent = nt();
function nt(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

/* ── INPUT ──────────────────────────────────────────────── */
function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

/* ── SEND (streaming) ────────────────────────────────────── */
async function send(){
  if(busy||status==='done') return;
  const inp=document.getElementById('inp');
  const msg=inp.value.trim();
  if(!msg) return;

  // Instant optimistic UI — user bubble appears NOW
  addBubble('me', msg);
  inp.value='';inp.style.height='auto';
  busy=true;
  document.getElementById('sbtn').disabled=true;

  // Create streaming AI bubble immediately
  const {bub} = mkStreamBub();

  try{
    const fd=new FormData();
    fd.append('message',msg);
    fd.append('csrfmiddlewaretoken',CSRF);

    const resp = await fetch(STREAM_URL,{method:'POST',body:fd});
    if(!resp.ok||!resp.body){
      bub.innerHTML='Hitilafu ya mtandao ('+(resp.status||'?')+').';
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let   buf     = '';
    let   txt     = '';

    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value,{stream:true});

      // SSE lines are separated by \n\n
      const parts = buf.split('\n\n');
      buf = parts.pop();

      for(const part of parts){
        if(!part.startsWith('data: ')) continue;
        let ev;
        try{ ev = JSON.parse(part.slice(6)); }catch{ continue; }

        if(ev.t){
          txt += ev.t;
          // Replace cursor with streamed text + cursor
          bub.innerHTML = esc(txt).replace(/\n/g,'<br>') + '<span class="cursor">▋</span>';
          scrollDown();
        }
        if(ev.error){
          bub.innerHTML = esc(ev.error);
        }
        if(ev.done){
          // Remove cursor, finalize text
          bub.innerHTML = esc(txt).replace(/\n/g,'<br>');
          if(ev.data){
            data   = ev.data;
            status = 'preview';
            renderPanel();
          } else {
            status = ev.status || 'collecting';
          }
        }
      }
    }
  } catch(e){
    bub.innerHTML = 'Hitilafu ya mtandao. Tafadhali jaribu tena.';
  } finally {
    busy = false;
    document.getElementById('sbtn').disabled = false;
    inp.focus();
  }
}

/* ── BUBBLE HELPERS ─────────────────────────────────────── */
function addBubble(role, text){
  const wrap = document.getElementById('msgs');
  const row  = document.createElement('div');
  row.className = 'row '+role;
  const icon = role==='ai'?'fa-robot':'fa-user';
  row.innerHTML = `
    <div class="av"><i class="fas ${icon}"></i></div>
    <div>
      <div class="bub">${esc(text).replace(/\n/g,'<br>')}</div>
      <div class="ts">${nt()}</div>
    </div>`;
  wrap.appendChild(row);
  scrollDown();
}

function mkStreamBub(){
  const wrap = document.getElementById('msgs');
  const row  = document.createElement('div');
  row.className = 'row ai';
  row.innerHTML = `
    <div class="av"><i class="fas fa-robot"></i></div>
    <div>
      <div class="bub"><span class="cursor">▋</span></div>
      <div class="ts">${nt()}</div>
    </div>`;
  wrap.appendChild(row);
  scrollDown();
  return { row, bub: row.querySelector('.bub') };
}

function scrollDown(){
  const w=document.getElementById('msgs');
  w.scrollTop=w.scrollHeight;
}

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

/* ── PANEL RENDER ────────────────────────────────────────── */
function renderPanel(){
  const filled = Object.values(data).filter(v=>v&&v!=='').length;
  const pct    = Math.min(100, Math.round((filled/TOTAL)*100));

  let h = `<div class="prg">
    <div class="prg-lbl"><span>Maendeleo</span><span>${filled}/${TOTAL}</span></div>
    <div class="prg-t"><div class="prg-f" style="width:${pct}%"></div></div>
  </div>`;

  for(const sec of SECS){
    if(!sec.fs.some(f=>data[f.k])) continue;
    h += `<div class="slbl"><i class="fas ${sec.ic}"></i>${sec.l}</div>`;
    for(const f of sec.fs){
      const v = data[f.k]||'';
      h += `<div class="frow">
        <div class="flbl">${f.l}</div>
        <div class="fval ${v?'':'mt'}">${
          v ? `<input type="text" value="${esc(v)}" id="fi_${f.k}"
                 onblur="saveF('${f.k}',this.value)"
                 onkeydown="if(event.key==='Enter')this.blur()">
               <button class="fedit" onclick="document.getElementById('fi_${f.k}').focus()" title="Hariri">
                 <i class="fas fa-pen-to-square"></i>
               </button>`
             : 'Bado...'
        }</div>
      </div>`;
    }
  }

  document.getElementById('dbody').innerHTML = h;
  document.getElementById('dfoot').style.display = status==='preview' ? 'block' : 'none';
}

async function saveF(field, value){
  data[field] = value;
  const fd=new FormData();
  fd.append('field',field);fd.append('value',value);
  fd.append('csrfmiddlewaretoken',CSRF);
  await fetch(EDIT_URL,{method:'POST',body:fd});
}

/* ── CONFIRM ─────────────────────────────────────────────── */
async function doConfirm(){
  const btn=document.getElementById('cfmbtn');
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>&nbsp;Inathibitisha...';
  try{
    const fd=new FormData();fd.append('csrfmiddlewaretoken',CSRF);
    const r=await fetch(CONFIRM_URL,{method:'POST',body:fd});
    const d=await r.json();
    if(d.status==='done'){
      status='done';
      document.getElementById('dbody').innerHTML=`
        <div class="dcard">
          <i class="fas fa-circle-check"></i>
          <h4>Taarifa Zimethibitishwa!</h4>
          <p>${d.message}</p>
        </div>`;
      document.getElementById('dfoot').style.display='none';
      addBubble('ai','✅ Asante! Taarifa zako zimethibitishwa. Hatua inayofuata ni AI kuingia mfumo wa HESLB na TCU kwa niaba yako.');
    }
  } catch(e){
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-circle-check"></i>THIBITISHA NA ENDELEA';
  }
}
