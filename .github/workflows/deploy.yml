name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:      # inawezesha kuchukua upya deploy bila push

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # ── Diagnostiki ──────────────────────────────────────────────────────
      # `railway status` inahitaji project iliyolink kwenye folda, na hapo
      # ndipo runs zote zilikuwa zinafeli kabla `railway up` kuanza. Tunatumia
      # `railway whoami` (hukagua token pekee, haihitaji link) na
      # `continue-on-error` ili ukaguzi usizuie deploy.
      - name: Check Railway token
        continue-on-error: true
        run: railway whoami
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      # `--project` inaipa CLI project hata kama folda haijalink. Bila hiyo,
      # `railway up` hufeli kwa "project not linked" kwenye CI. Tunaongeza
      # tu kama RAILWAY_PROJECT_ID imewekwa; na tunarudisha stderr ya CLI
      # kama annotation ili kosa lionekane bila kufungua logs.
      - name: Deploy to Railway
        run: |
          set +e
          ARGS=(--detach --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT")
          if [ -n "$RAILWAY_PROJECT_ID" ]; then
            ARGS+=(--project "$RAILWAY_PROJECT_ID")
          fi
          OUT=$(railway up "${ARGS[@]}" 2>&1)
          CODE=$?
          printf '%s\n' "$OUT"
          if [ "$CODE" -ne 0 ]; then
            MSG=$(printf '%s' "$OUT" | tail -n 15 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Railway deploy failed::$MSG"
            exit "$CODE"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || 'hikari' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || 'production' }}
