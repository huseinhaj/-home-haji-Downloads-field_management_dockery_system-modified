{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<script>
var DISTRICTS_DATA = {{ districts_json|safe }};

document.addEventListener('DOMContentLoaded', function() {
    var regionSelect = document.getElementById('id_region');
    var districtSelect = document.getElementById('id_district');
    if (!regionSelect || !districtSelect) return;

    var savedDistrict = districtSelect.value;

    function filterDistricts() {
        var regionId = String(regionSelect.value);
        var districts = DISTRICTS_DATA[regionId] || [];
        districtSelect.innerHTML = '<option value="">---------</option>';
        districts.forEach(function(d) {
            var opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = d.name;
            if (String(d.id) === String(savedDistrict)) opt.selected = true;
            districtSelect.appendChild(opt);
        });
    }

    regionSelect.addEventListener('change', function() {
        savedDistrict = '';
        filterDistricts();
    });

    if (regionSelect.value) filterDistricts();
});
</script>
{% endblock %}
