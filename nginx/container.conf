# ── Container nginx (Railway) ────────────────────────────────────────────────
# Runs as the non-root appuser: pid + logs live in /tmp.
# ${PORT} is substituted by the entrypoint (sed) — this is the port Railway
# exposes; nginx owns it and proxies to the two internal Django processes.
#
#   /ttc/*          → TTC Student Portal (gunicorn 127.0.0.1:8001)
#   /ttc/static/    → served from disk (ttc_portal/static)
#   /ttc/media/     → served from disk (ttc_portal/media)
#   /static/, /media/ and everything else → field_management (127.0.0.1:8000)

worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # Field management uploads PDFs/Excel — keep the same generous cap gunicorn had
    client_max_body_size 100M;

    # Container runs as a NON-ROOT user — nginx cannot create its default temp
    # dirs under /var/lib/nginx (Permission denied → instant [emerg] exit). Keep
    # ALL temp files in /tmp, which the appuser can write.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    access_log /tmp/nginx-access.log;

    upstream field_management { server 127.0.0.1:8000; }
    upstream ttc_portal        { server 127.0.0.1:8001; }

    server {
        listen ${PORT} default_server;
        server_name _;

        # TTC static + media straight from disk (no Django involved).
        # Served from the COLLECTED dir (staticfiles) so Django admin assets are
        # included — docker-entrypoint.sh runs TTC collectstatic before boot.
        location /ttc/static/ {
            alias /app/ttc_portal/staticfiles/;
            # NOT immutable: TTC filenames are not content-hashed, so browsers
            # must revalidate after deploys to pick up CSS/JS changes.
            expires 7d;
            add_header Cache-Control "public";
        }
        location /ttc/media/ {
            alias /app/ttc_portal/media/;
            expires 30d;
        }

        # /ttc without trailing slash → keep the prefix normalised
        location = /ttc {
            return 302 /ttc/;
        }

        # TTC Student Portal — separate Django project, separate database.
        # The trailing slash on proxy_pass STRIPS the /ttc/ prefix before it
        # reaches the app; Django's FORCE_SCRIPT_NAME='/ttc' re-adds it to all
        # generated URLs, so request.path_info='/login/' resolves normally.
        location /ttc/ {
            proxy_pass http://ttc_portal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        # Field Management static
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location /media/ {
            alias /app/media/;
            expires 30d;
        }

        # Everything else → field_management
        location / {
            proxy_pass http://field_management;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
        }
    }
}
