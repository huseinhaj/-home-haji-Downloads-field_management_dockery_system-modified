version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: field_db
      POSTGRES_USER: field_user
      POSTGRES_PASSWORD: field_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://field_user:field_pass@db:5432/field_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /home/haji/Downloads:/mnt/downloads:ro
      - staticfiles:/app/staticfiles
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery:
    build: .
    command: celery -A field_management worker --loglevel=info --concurrency=2 --queues=default,emails
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://field_user:field_pass@db:5432/field_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /home/haji/Downloads:/mnt/downloads:ro
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A field_management beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://field_user:field_pass@db:5432/field_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  staticfiles:
