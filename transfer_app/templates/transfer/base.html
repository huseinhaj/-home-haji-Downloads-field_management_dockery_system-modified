<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mfumo wa Kubadilishana Walimu{% endblock %} — Tanzania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --green:   #0d6e4e;
            --green2:  #16a37a;
            --light-g: #e8f5f0;
            --gold:    #d4a017;
            --dark:    #1a2e27;
            --border:  #c8ddd6;
            --text:    #1f3a30;
        }
        body { background: #f4faf7; font-family: 'Segoe UI', sans-serif; color: var(--text); }

        .navbar-brand { font-weight: 800; font-size: 1.1rem; letter-spacing: .3px; }
        .navbar { background: linear-gradient(135deg, var(--dark) 0%, var(--green) 100%); box-shadow: 0 2px 12px rgba(0,0,0,.15); }
        .navbar * { color: #fff !important; }

        .hero { background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%); color: #fff; padding: 2.5rem 1rem; text-align: center; }
        .hero h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: .5rem; }
        .hero p  { opacity: .88; font-size: 1rem; margin: 0; }

        .card-t { border: none; border-radius: 14px; box-shadow: 0 4px 18px rgba(13,110,78,.1); overflow: hidden; }
        .card-t .card-header { background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%); color: #fff; padding: 1.2rem 1.4rem; border: none; }
        .card-t .card-header h4 { margin: 0; font-weight: 700; font-size: 1.1rem; }

        .btn-primary-t {
            background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
            border: none; border-radius: 40px; color: #fff; font-weight: 700;
            padding: .7rem 1.8rem; transition: all .2s;
        }
        .btn-primary-t:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(13,110,78,.35); color: #fff; }

        .btn-outline-t {
            border: 2px solid var(--green); color: var(--green); border-radius: 40px;
            font-weight: 700; padding: .65rem 1.6rem; background: transparent; transition: all .2s;
        }
        .btn-outline-t:hover { background: var(--green); color: #fff; }

        .badge-level-primary   { background: rgba(13,110,78,.12); color: var(--green); border: 1px solid rgba(13,110,78,.3); }
        .badge-level-secondary { background: rgba(212,160,23,.12); color: #8a6500; border: 1px solid rgba(212,160,23,.4); }

        .teacher-card {
            border-radius: 14px; border: 1px solid var(--border); background: #fff;
            transition: all .2s; overflow: hidden;
        }
        .teacher-card:hover { box-shadow: 0 6px 24px rgba(13,110,78,.15); transform: translateY(-3px); border-color: var(--green2); }
        .teacher-card .tc-header { background: var(--light-g); padding: .9rem 1.1rem; border-bottom: 1px solid var(--border); }

        .region-card {
            border-radius: 12px; border: 1px solid var(--border); background: #fff;
            padding: 1rem 1.2rem; transition: all .2s; cursor: pointer; text-decoration: none !important;
            display: block; color: var(--text) !important;
        }
        .region-card:hover { background: var(--light-g); border-color: var(--green2); transform: translateY(-2px); box-shadow: 0 4px 14px rgba(13,110,78,.12); }

        .breadcrumb-t { background: var(--light-g); border-radius: 30px; padding: .4rem 1rem; display: inline-flex; gap: .4rem; align-items: center; font-size: .85rem; }
        .breadcrumb-t a { color: var(--green); text-decoration: none; font-weight: 600; }
        .breadcrumb-t a:hover { text-decoration: underline; }
        .breadcrumb-t .sep { color: #aaa; }

        .form-control:focus, .form-select:focus { border-color: var(--green2); box-shadow: 0 0 0 3px rgba(22,163,122,.15); }
        .form-label { font-weight: 600; font-size: .85rem; color: var(--dark); }

        .section-title { font-size: .8rem; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .5px; margin-bottom: .8rem; padding-bottom: .4rem; border-bottom: 2px solid var(--border); }

        .stats-pill { background: var(--light-g); border-radius: 30px; padding: .3rem .9rem; font-size: .8rem; color: var(--green); font-weight: 600; }

        footer { background: var(--dark); color: rgba(255,255,255,.65); font-size: .8rem; padding: 1.2rem; text-align: center; margin-top: 3rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg px-3 py-2">
    <a class="navbar-brand" href="{% url 'transfer:home' %}">
        <i class="fas fa-exchange-alt me-2"></i>Kubadilishana Walimu
    </a>
    <div class="ms-auto d-flex gap-2 align-items-center">
        {% if teacher %}
        <span style="font-size:.8rem;color:rgba(255,255,255,.75);">
            <i class="fas fa-user-check me-1"></i>{{ teacher.name }}
        </span>
        <form method="post" action="{% url 'transfer:deactivate' %}" class="d-inline m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm" style="background:rgba(255,255,255,.15);color:#fff;border-radius:20px;font-size:.75rem;" onclick="return confirm('Unataka kufuta taarifa zako?')">
                <i class="fas fa-sign-out-alt me-1"></i>Ondoa
            </button>
        </form>
        {% endif %}
    </div>
</nav>

{% block hero %}{% endblock %}

<div class="container py-4">
    {% block content %}{% endblock %}
</div>

<footer>
    <i class="fas fa-chalkboard-teacher me-1"></i>Mfumo wa Kubadilishana Walimu Tanzania &copy; 2026
    &nbsp;|&nbsp; <a href="{% url 'dashboard' %}" style="color:rgba(255,255,255,.5);font-size:.75rem;">IMS ↗</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
