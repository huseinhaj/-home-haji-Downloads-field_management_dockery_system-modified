{% load static %}<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><title>{{ title }}</title>
<style>
  /* Official documents: black & white only, serif, no app chrome.
     Render with your PDF engine (WeasyPrint / Playwright / wkhtmltopdf) or browser print.
     Page numbers via @page counters. */
  @page{size:{% block pagesize %}A4{% endblock %};margin:14mm 15mm 16mm;
    @bottom-center{content:"Ukurasa " counter(page) " kati ya " counter(pages);font:9pt 'Times New Roman',serif}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Times New Roman','Liberation Serif',serif;color:#000;font-size:10.3pt;line-height:1.35}
  table{border-collapse:collapse;width:100%}
  td,th{border:.6pt solid #000;padding:1.6mm 2mm;vertical-align:top}
  th{background:#E8E8E8;font-weight:700;text-align:center;vertical-align:middle}
  thead{display:table-header-group}tr{page-break-inside:avoid}
  .lb{background:#F2F2F2;font-weight:700}
  .head{text-align:center}.head img{width:22mm}
  .head .l1{font-weight:700;font-size:13pt;margin-top:2mm}.head .l2{font-weight:700;font-size:11.5pt}
  .head .rule{width:80mm;border-top:1pt solid #000;margin:5mm auto 0}
  .head .ttl{font-weight:700;font-size:17pt;letter-spacing:1.5pt;margin-top:4mm}.head .sub{font-style:italic}
  .cover{border:1.4pt solid #000;outline:.5pt solid #000;outline-offset:-2mm;padding:12mm 14mm;page-break-after:always}
  .info{width:150mm;margin:8mm auto 0;font-size:11pt}.info td{padding:2.2mm 3mm}.info td:first-child{width:52mm}
  h3{font-size:10.8pt;margin:5mm 0 1.6mm;text-transform:uppercase;letter-spacing:.4pt;border-bottom:.8pt solid #000;padding-bottom:.8mm;page-break-after:avoid}
  {% block css %}{% endblock %}
</style></head><body>{% block body %}{% endblock %}</body></html>
