<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F2B"/>
      <stop offset="100%" style="stop-color:#1EB53A"/>
    </linearGradient>
    <linearGradient id="goldSplash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD116"/>
      <stop offset="100%" style="stop-color:#D9A441"/>
    </linearGradient>
    <filter id="shadowSplash">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgSplash)"/>
  
  <!-- Top gold accent bar -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#goldSplash)"/>
  
  <!-- Bottom gold accent bar -->
  <rect x="0" y="634" width="1280" height="6" fill="url(#goldSplash)"/>

  <!-- Book icon centered -->
  <g transform="translate(640, 240)" filter="url(#shadowSplash)">
    <!-- Left page -->
    <path d="M-8,-120 L-8,80 C-8,90 -18,95 -28,95 L-130,95 C-145,95 -155,85 -155,70 L-155,-120 Z" 
          fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
    <!-- Right page -->
    <path d="M8,-120 L8,80 C8,90 18,95 28,95 L130,95 C145,95 155,85 155,70 L155,-120 Z" 
          fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
    <!-- Book spine -->
    <rect x="-10" y="-120" width="20" height="215" rx="3" fill="url(#goldSplash)" opacity="0.5"/>
    <line x1="0" y1="-120" x2="0" y2="95" stroke="#D9A441" stroke-width="3"/>
    <!-- Text lines -->
    <g opacity="0.3">
      <line x1="-120" y1="-80" x2="-20" y2="-80" stroke="#1F7A3D" stroke-width="5" stroke-linecap="round"/>
      <line x1="-120" y1="-55" x2="-40" y2="-55" stroke="#1F7A3D" stroke-width="5" stroke-linecap="round"/>
      <line x1="-120" y1="-30" x2="-25" y2="-30" stroke="#1F7A3D" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="-80" x2="120" y2="-80" stroke="#1F7A3D" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="-55" x2="100" y2="-55" stroke="#1F7A3D" stroke-width="5" stroke-linecap="round"/>
      <line x1="20" y1="-30" x2="105" y2="-30" stroke="#1F7A3D" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Bookmark -->
    <path d="M-6,-120 L-6,-150 L4,-135 L14,-150 L14,-120" fill="#FCD116" stroke="#B8891E" stroke-width="1.5"/>
  </g>

  <!-- Title -->
  <text x="640" y="400" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" 
        fill="url(#goldSplash)" text-anchor="middle" letter-spacing="6">TLM TANZANIA</text>
  
  <!-- Subtitle -->
  <text x="640" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="600" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="2" opacity="0.9">Teaching &amp; Learning Materials</text>
  
  <!-- Swahili subtitle -->
  <text x="640" y="470" font-family="Arial, sans-serif" font-size="16" font-weight="400" 
        fill="#FCD116" text-anchor="middle" letter-spacing="1" opacity="0.8">Mfumo wa Nyenzo za Kufundishia na Kujifunza</text>

  <!-- Ministry name -->
  <text x="640" y="530" font-family="Arial, sans-serif" font-size="13" font-weight="700" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="3" opacity="0.7">WIZARA YA ELIMU, SAYANSI NA TEKNOLOJIA</text>
  <text x="640" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="400" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="2" opacity="0.5">JAMHURI YA MUUNGANO WA TANZANIA</text>

  <!-- Loading indicator (dots) -->
  <g transform="translate(640, 590)">
    <circle cx="-20" cy="0" r="5" fill="#FCD116" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#FCD116" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="20" cy="0" r="5" fill="#FCD116" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>
</svg>
